<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ruang Kontrol - Laboratory Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <div id="control-app" class="d-flex vh-100">
      <aside class="sidebar bg-white border-end p-3">
        <h5 class="mb-4">Ruang Kontrol</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link active" href="#" data-page="dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-page="monitoring">Monitoring</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-page="device">Device</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-page="settings">Settings</a></li>
          <li class="nav-item mt-3"><a class="nav-link text-danger" href="#" id="logoutBtn">Logout</a></li>
        </ul>
      </aside>

      <div class="flex-grow-1 d-flex flex-column">
        <nav class="navbar navbar-light bg-white border-bottom px-4">
          <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Dashboard</span>
            <div>
              <span id="admin-info" class="me-3"></span>
              <button id="refreshBtn" class="btn btn-outline-secondary btn-sm">Refresh</button>
            </div>
          </div>
        </nav>

        <main class="p-4 overflow-auto">
          <div id="loginBox" class="card shadow-sm w-100 mx-auto p-4" style="max-width:420px">
            <h5>Admin Login</h5>
            <form id="loginForm" class="mt-3">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" id="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
              </div>
              <button class="btn btn-primary">Login</button>
            </form>
          </div>

          <div id="dashboard" class="d-none">
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <div class="card p-3 shadow-sm">
                  <h6>Jumlah Lab Online</h6>
                  <div id="count-online" class="h2">0</div>
                </div>
              </div>
              <div class="col-12 col-md-4">
                <div class="card p-3 shadow-sm">
                  <h6>Jumlah Lab Offline</h6>
                  <div id="count-offline" class="h2">0</div>
                </div>
              </div>
              <div class="col-12 col-md-4">
                <div class="card p-3 shadow-sm">
                  <h6>Total Device</h6>
                  <div id="count-device" class="h2">0</div>
                </div>
              </div>
            </div>

            <div class="row mt-3">
              <div class="col-12 col-lg-6">
                <div class="card shadow-sm p-3">
                  <h6>Monitoring</h6>
                  <div id="labsList" class="list-group list-group-flush"></div>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <div class="card shadow-sm p-3">
                  <h6>Activity Log</h6>
                  <div id="activityLog" class="small text-muted" style="max-height:360px;overflow:auto"></div>
                </div>
              </div>
            </div>
          </div>

          <div id="monitoringView" class="d-none mt-3">
            <div class="card shadow-sm">
              <div class="card-body">
                <div class="d-flex mb-3 justify-content-between align-items-center">
                  <div>
                    <h5 id="mv-labname">--</h5>
                    <small id="mv-info" class="text-muted">--</small>
                  </div>
                  <div class="d-flex gap-2">
                    <button id="btn-mic-toggle" class="btn btn-outline-warning btn-sm" title="Toggle Microphone">
                      <span id="mic-icon">🎤</span> Mic
                    </button>
                    <button id="btn-fullscreen" class="btn btn-outline-secondary btn-sm">Fullscreen</button>
                    <button id="btn-snapshot" class="btn btn-outline-primary btn-sm">Snapshot</button>
                    <button id="btn-record" class="btn btn-outline-danger btn-sm">Record</button>
                    <button id="btn-mute" class="btn btn-outline-secondary btn-sm">Mute</button>
                    <button id="btn-refresh" class="btn btn-outline-secondary btn-sm">Refresh</button>
                  </div>
                </div>

                <div class="mb-3">
                  <small class="text-muted">Microphone Level</small>
                  <div class="progress" style="height:6px">
                    <div id="micLevelBar" class="progress-bar bg-warning" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                  </div>
                </div>

                <div class="row g-2">
                  <div class="col-12 col-lg-8">
                    <div class="ratio ratio-16x9 bg-dark rounded" id="videoWrap">
                      <video id="remoteVideo" autoplay playsinline class="w-100 h-100" style="object-fit:cover"></video>
                    </div>
                    <div class="mt-2 small text-muted" id="mv-status">Status: --</div>
                  </div>
                  <div class="col-12 col-lg-4">
                    <div class="ratio ratio-1x1 bg-dark rounded">
                      <video id="localControlVideo" autoplay playsinline muted class="w-100 h-100" style="object-fit:cover"></video>
                    </div>
                    <div class="mt-2 small text-muted">Local Preview (Kontrol)</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="/assets/js/control-main.js"></script>
  </body>
</html>
